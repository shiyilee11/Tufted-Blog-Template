name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Build the site
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Use GitHub's release API: the browser download URL can return HTTP 504.
      - name: Install Typst
        env:
          GH_TOKEN: ${{ github.token }}
          TYPST_VERSION: "0.14.2"
        run: |
          typst_dir="$RUNNER_TEMP/typst"
          mkdir -p "$typst_dir"
          gh release download "v$TYPST_VERSION" \
            --repo typst/typst \
            --pattern typst-x86_64-unknown-linux-musl.tar.xz \
            --dir "$typst_dir"
          tar -xJf "$typst_dir/typst-x86_64-unknown-linux-musl.tar.xz" -C "$typst_dir"
          "$typst_dir/typst-x86_64-unknown-linux-musl/typst" --version
          echo "$typst_dir/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install -g staticrypt
      - run: python build.py build -f
        env:
          BLOG_PRIVATE_PASSWORD: ${{ secrets.BLOG_PRIVATE_PASSWORD }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  # Publish to GitHub Pages
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
